# Apache Maven Wrapper configuration (script-only: no maven-wrapper.jar needed).
#
# The first run of ./mvnw or mvnw.cmd downloads this distribution into
# ~/.m2/wrapper/dists and reuses it forever after. The SHA-512 below is the
# official checksum published next to the zip on repo.maven.apache.org; the
# wrapper refuses to install a distribution that does not match it.
#
# To upgrade Maven: change the version in both lines below and replace the
# checksum with the contents of <distributionUrl>.sha512.

wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
distributionSha512Sum=ed41650d42485cfc243fad22158caf9cbb5dc408ce7a09ddb94dd42a019de929ca43065bfa450612cf12bf78b5cafa3884b96c090de326ff590448c933454af3
