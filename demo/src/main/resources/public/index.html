<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="Live market watchlists, charts and a local paper portfolio.">
    <title>Ticker</title>

    <!--
      The theme is applied before the stylesheets paint. Doing this in a module
      script would run after first paint and flash the wrong background.
    -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('ticker.theme');
                var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
                document.documentElement.dataset.theme = theme;
                if (localStorage.getItem('ticker.palette') === 'accessible') {
                    document.documentElement.dataset.palette = 'accessible';
                }
            } catch (e) {
                /* localStorage can throw in private mode; the default theme is fine. */
            }
        })();
    </script>

    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📈</text></svg>">
</head>

<body>
    <div class="app">
        <header class="topbar">
            <a class="brand" href="/" data-link>
                <svg class="brand__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M3 17.5 9 11l4 4 8-9" stroke="currentColor" stroke-width="2.2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 6h5v5" stroke="currentColor" stroke-width="2.2"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Ticker</span>
            </a>

            <nav class="topbar__nav" aria-label="Primary">
                <a class="nav-link" href="/portfolio" data-link data-route="portfolio">Portfolio</a>
            </nav>

            <div class="topbar__spacer"></div>

            <button type="button" class="search-trigger" id="search-trigger"
                    aria-label="Search stocks">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
                    <path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Search stocks</span>
                <kbd>Ctrl K</kbd>
            </button>

            <output class="market-pill" id="market-pill" data-session="UNKNOWN" title="US equities session">
                <span class="market-pill__dot" aria-hidden="true"></span>
                <span id="market-pill-text">Loading</span>
            </output>

            <button type="button" class="icon-button" id="palette-toggle"
                    aria-label="Toggle colour-blind-safe palette" title="Colour-blind-safe palette">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 3.5v17" stroke="currentColor" stroke-width="2"/>
                </svg>
            </button>

            <button type="button" class="icon-button" id="theme-toggle"
                    aria-label="Switch between light and dark theme" title="Switch theme">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" stroke="currentColor" stroke-width="2"
                          stroke-linejoin="round"/>
                </svg>
            </button>
        </header>

        <aside class="rail" aria-label="Watchlist">
            <div class="rail__header">
                <h2 class="rail__title" id="rail-title">Watchlist</h2>
                <span class="rail__count" id="rail-count"></span>
            </div>
            <div class="watchlist" id="watchlist" role="list"></div>
        </aside>

        <main class="main" id="main" tabindex="-1">
            <div class="empty">
                <p class="empty__title">Loading</p>
                <p class="note">Connecting to the market data feed.</p>
            </div>
        </main>
    </div>

    <!-- Search palette --------------------------------------------------- -->
    <div class="palette-backdrop" id="palette-backdrop" hidden>
        <div class="palette" role="dialog" aria-modal="true" aria-label="Search stocks">
            <input type="text" class="palette__input" id="palette-input"
                   placeholder="Search by ticker or company…" autocomplete="off"
                   spellcheck="false" role="combobox" aria-expanded="true"
                   aria-controls="palette-results" aria-autocomplete="list">
            <div class="palette__results" id="palette-results" role="listbox" aria-label="Search results"></div>
            <div class="palette__hint">
                <span><strong>↑↓</strong> navigate</span>
                <span><strong>↵</strong> open</span>
                <span><strong>esc</strong> close</span>
            </div>
        </div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
